name: CI
on: [push, pull_request]
jobs:
  build-test:
    runs-on: windows-latest      # real target: exercises windows_subsystem + %APPDATA% behavior
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master pinned 2026-08-28
        with:
          toolchain: '1.93.1'
          components: clippy
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      # The headless journey suite (all sim_journeys_* tests), run serially so
      # the reported timing is deterministic. The same tests already ran in
      # `cargo test --all-targets`; this step makes the suite explicit and its
      # runtime measurable (must stay under 60 s).
      - name: Headless journey suite
        run: cargo test --locked --bin copyit sim_journeys -- --test-threads 1
        timeout-minutes: 3
      - name: Upload simulation report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sim-report
          path: sim-report/
          if-no-files-found: ignore
  audit:
    runs-on: ubuntu-latest       # cargo audit reads Cargo.lock (all-platform); cheap + identical here
    permissions:
      contents: read             # checkout the repository
      checks: write              # rustsec/audit-check posts results as a check run
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
