[advisories]
ignore = [
    # quick-xml: only reachable via wayland-scanner -> smithay-client-toolkit ->
    # winit/smithay-clipboard -> egui-winit -> eframe, a Linux/Wayland-only
    # chain. Confirmed absent from the Windows graph via
    # `cargo tree --target x86_64-pc-windows-msvc -i quick-xml` (empty).
    "RUSTSEC-2026-0194", # quick-xml: quadratic runtime on duplicate attribute names
    "RUSTSEC-2026-0195", # quick-xml: unbounded namespace-declaration allocation (DoS)

    # derivative: only reachable via zbus -> accesskit_unix -> accesskit_winit
    # -> egui-winit, a Unix-only chain. Confirmed absent from the Windows graph
    # via `cargo tree --target x86_64-pc-windows-msvc -i derivative` (empty).
    "RUSTSEC-2024-0388", # derivative: unmaintained

    # instant: confirmed absent from the Windows graph via
    # `cargo tree --target x86_64-pc-windows-msvc -i instant` (empty).
    "RUSTSEC-2024-0384", # instant: unmaintained
]
# NOT ignored, and deliberately so:
# - ttf-parser (RUSTSEC-2026-0192, unmaintained) reaches the Windows build via
#   ttf-parser -> owned_ttf_parser -> ab_glyph -> epaint -> egui -> copyit.
# - paste (RUSTSEC-2024-0436, unmaintained) reaches the Windows build via
#   paste -> accesskit_windows -> accesskit_winit -> egui-winit -> eframe -> copyit.
# Both were verified with `cargo tree --target x86_64-pc-windows-msvc -i <crate>`
# and are real findings on the Windows target; see DEP-001 in the completion report.
